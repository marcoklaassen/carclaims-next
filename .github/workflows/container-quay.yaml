name: Build and Push Container Image

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: quay.io/mklaasse/frida-carclaims-frontend

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.brand }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Default FRIDA brand — backward-compatible tags (latest, sha, semver)
          - brand: frida
            build-args: ""
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=semver,pattern={{version}}
              type=sha,prefix=,format=short

          # Red Hat brand — tagged with 'redhat' prefix
          - brand: redhat
            build-args: |
              NEXT_PUBLIC_PRIMARY_COLOR=#ee0000
              NEXT_PUBLIC_SECONDARY_COLOR=#a60000
              NEXT_PUBLIC_HEADER_BG=#151515
              NEXT_PUBLIC_LOGO_URL=/api/logo
              NEXT_PUBLIC_LOGO_POSITION=left
              NEXT_PUBLIC_BUTTON_RADIUS=2px
              NEXT_PUBLIC_FAVICON=/api/favicon
              BRAND_FONT=red-hat-text
              LOGO_SOURCE_URL=https://static.redhat.com/libs/redhat/brand-assets/2/corp/logo--on-dark.svg
              FAVICON_SOURCE_URL=https://www.redhat.com/favicon.ico
            tags: |
              type=raw,value=redhat,enable={{is_default_branch}}
              type=semver,pattern=redhat-{{version}}
              type=sha,prefix=redhat-,format=short

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ matrix.tags }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.brand }}
          cache-to: type=gha,mode=max,scope=${{ matrix.brand }}
